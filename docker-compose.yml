version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tmdb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_password
      POSTGRES_DB: movie_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: